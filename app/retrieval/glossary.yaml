# 사내 용어집 — 한국어 질문을 영문 문서 용어로 잇는다.
#
# 왜 필요한가.
#   이 문서군은 전부 영문인데 질문은 한국어로 들어온다. 밀집 검색은 다국어
#   임베딩(bge-m3)이 어느 정도 건너주지만, 희소 검색은 "메모리"라는 토큰이
#   영문 문서에 없으므로 한 건도 맞히지 못한다. 하이브리드 검색의 절반이
#   죽어 있는 셈이고, 하필 죽은 쪽이 모델명·파트번호에 강한 쪽이다.
#
#   그래서 질의 단계에서 한국어를 문서의 표현으로 바꿔 준다. 문서를 번역해
#   중복 색인하는 방식보다 저장 비용과 재색인 부담이 없다.
#
# 운영 방법.
#   사내 용어는 조직마다 다르다. 이 파일은 코드가 아니므로 실무자가 직접
#   늘린다. 평가에서 못 찾은 질문의 단어를 여기에 추가하는 것이 가장 값싼
#   품질 개선이다. GLOSSARY_PATH 로 사내 전용 파일을 지정할 수 있다.

# 구(句) 우선. 긴 표현부터 먼저 치환한다.
