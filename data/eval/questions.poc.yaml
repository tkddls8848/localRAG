    tags: [spec, memory]

  - id: q012
    question: SR650a V4 의 최대 메모리 용량을 알려주세요.
    answers:
      - document: Lenovo ThinkSystem SR650a V4 and SR650i V4 Servers
        pages: [11]
    expect: "8TB"
    tags: [spec, memory]

  - id: q013
    question: SR680a V4 는 메모리를 최대 몇 TB 까지 지원하나요?
    answers:
      - document: Lenovo ThinkSystem SR680a V4 Server
        pages: [10]
    expect: "4TB"
    tags: [spec, memory]

  - id: q014
    question: SR850 V4 최대 메모리 용량은?
    answers:
      - document: Lenovo ThinkSystem SR850 V4 Server
        pages: [13]
