    # 나열한 절이다. 원문을 읽고 둘 다 질문에 답한다고 확인해 함께 적었다.
    question: SR650 V4 의 최대 드라이브 베이 구성을 알려주세요.
    answers:
      - document: Lenovo ThinkSystem SR650 V4 Server
