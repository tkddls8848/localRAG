# PoC 정답표 — data/pdfs/ 의 Lenovo 제품 가이드 6건 기준
#
# 만든 방법과 한계를 먼저 밝힌다.
#   - 정답 위치(문서·페이지)는 색인된 청크에서 확인했다. 파서가 페이지를
#     끝까지 보존하므로 페이지 번호는 정확하다.
#   - 질문 문구는 사람이 한국어로 다시 썼다. 표의 항목명을 그대로 쓰면
#     색인 파이프라인이 만든 문제를 같은 파이프라인이 푸는 셈이 되어 점수가
#     실제보다 높게 나온다(tools/draft_questions.py 주석).
#   - **이것은 출발점이다.** 실무자가 실제로 던진 질문을 섞어야 의미가 있다.
#     `GET /admin/queries?only_failed=true` 로 실패한 질문을 모아 여기에 추가한다.
#
# 사용:
#   cp data/eval/questions.poc.yaml data/eval/questions.yaml
#   python -m app.evaluation.run --modes dense,sparse,exact,hybrid,hybrid+rerank
#
# 정답 위치가 여러 곳인 질문
#   같은 사실이 표준 사양표 한 줄과 본문 절 양쪽에 있는 경우가 있다. 원문을
#   읽고 둘 다 질문에 답한다고 확인한 경우에만 pages 에 함께 적었다. 점수를
#   올리려고 그럴듯한 페이지를 넣으면 평가가 무의미해진다.
#
# 태그
#   spec                단순 스펙 수치 조회
#   identifier          파트번호·피처코드 정확 일치 (하이브리드 검색 검증)
#   model-disambiguation 같은 항목을 여러 모델에 물어 모델 혼동 확인
#   comparison          여러 제품을 함께 봐야 답이 되는 질문
#   long-tail           문서 뒤쪽 부록의 세부 수치
#   honesty             문서에 답이 없는 함정 질문

questions:
  # --- 표준 사양: 폼 팩터 (모델 혼동 검증용으로 6종 모두 물어본다) ---
  - id: q001
    question: SR630 V4 는 몇 U 랙 서버인가요?
    answers:
      - document: Lenovo ThinkSystem SR630 V4 Server
        pages: [14]
    expect: "1U rack"
    tags: [spec, model-disambiguation]

  - id: q002
    question: SR650 V4 의 폼 팩터를 알려주세요.
    answers:
      - document: Lenovo ThinkSystem SR650 V4 Server
        pages: [14]
    expect: "2U rack"
    tags: [spec, model-disambiguation]

  - id: q003
    question: SR650a V4 는 랙에서 몇 U 를 차지하나요?
    answers:
      - document: Lenovo ThinkSystem SR650a V4 and SR650i V4 Servers
        pages: [11]
    expect: "2U rack"
    tags: [spec, model-disambiguation]

  - id: q004
    question: SR680a V4 의 폼 팩터는 무엇인가요?
    answers:
      - document: Lenovo ThinkSystem SR680a V4 Server
        pages: [10]
    expect: "8U rack"
    tags: [spec, model-disambiguation]

  - id: q005
    question: SR850 V4 는 몇 U 섀시인가요?
    answers:
      - document: Lenovo ThinkSystem SR850 V4 Server
        pages: [13]
    expect: "2U rack"
    tags: [spec, model-disambiguation]

  - id: q006
    question: SR860 V4 의 랙 높이는 몇 U 입니까?
    answers:
      - document: Lenovo ThinkSystem SR860 V4 Server
        pages: [17]
    expect: "4U rack"
    tags: [spec, model-disambiguation]

